packages:
  - services/*
  - packages/*
  - packages/os/*
  - missions/*/workpiece
allowBuilds:
  better-sqlite3: true
  core-js: false
  esbuild: true
  libxmljs2: false
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@astrojs/markdown-satteri@0.3.1'
  - astro@7.0.0
  - '@astrojs/cloudflare@14.0.0'
  - '@warpgogol/repo-extract'
  - '@warpgogol/forge'
  - '@warpgogol/changelog-live'
