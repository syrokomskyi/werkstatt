engineStrict: true
packages:
  - services/*
  - packages/*
  - missions/*/workpiece
allowBuilds:
  better-sqlite3: true
  core-js: false
  esbuild: true
  libxmljs2: false
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@astrojs/markdown-satteri@0.3.1'
  - astro@7.0.0
  - '@astrojs/cloudflare@14.0.0'
  - '@warpgogol/repo-extract'
  - '@warpgogol/forge'
  - '@warpgogol/changelog-live'

overrides:
  '@syrokomskyi/axiom-capture': 'link:../pipelines/packages/axiom/axiom-capture'
  '@syrokomskyi/axiom-factory-app': 'link:../pipelines/apps/axiom/factory'
  '@syrokomskyi/axiom-study': 'link:../pipelines/packages/axiom/axiom-study'
  '@warpgogol/forge': 'workspace:*'
  '@warpgogol/werkstatt': 'workspace:*'
  '@warpgogol/werkstatt-shared': 'workspace:*'
  '@warpgogol/werkstatt-site': 'workspace:*'
