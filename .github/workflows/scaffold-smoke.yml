name: Scaffold smoke test

# [RFC-0030 Phase C] CI smoke test for onboarding.scaffold.
# Runs on every PR that touches the scaffold, checks, or the reference app.
# Generates a throwaway app → rotates key → runs app.contract.full → asserts exit 0 → cleans up.
# This is the load-bearing acceptance signal for RFC-0029 and RFC-0030 jointly (DNA-35 / DNA-36).

on:
  pull_request:
    paths:
      - "packages/werkstatt-site/src/onboarding/**"
      - "packages/werkstatt-site/src/checks/**"
      - "packages/forge/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scaffold-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Scaffold smoke test
    env:
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run onboarding.scaffold (throwaway client)
        run: |
          pnpm exec werkstatt run onboarding.scaffold \
            --client __scaffold-test__ \
            --domain test.example.de \
            --biome nonprofit-trust \
            --constellation nonprofit-donation-funnel
        # The private key is printed to stdout but not captured — smoke test
        # only verifies that app.contract.full passes, not that signing works.

      - name: Build prepare for scaffolded app
        run: pnpm --filter __scaffold-test__ build.prepare

      - name: Run app.contract.full on scaffolded app
        run: |
          pnpm exec werkstatt run app.contract.full \
            --app __scaffold-test__
        # Exit code propagated by kernel — 0 = all validators pass, 1 = at least one failed.

      - name: Cleanup scaffolded app
        if: always()
        run: rm -rf apps/__scaffold-test__
