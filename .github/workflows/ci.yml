name: Autonomous quality gate

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  autonomous-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Package quality and author checks
    env:
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Workflow lint (actionlint)
        run: |
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest /usr/local/bin
          actionlint -color

      - name: Local CI contract
        run: pnpm exec werkstatt run ci.local.validate --json

      - name: GitHub branch protection policy
        run: pnpm exec werkstatt run github.branch-protection.validate --json

      - name: Package lint
        run: pnpm lint:packages

      - name: Package checks
        run: pnpm exec werkstatt run packages-check.run --json

      - name: RFC validation
        run: pnpm exec werkstatt run rfc.validate

      - name: RFC command lifecycle validation
        run: pnpm exec werkstatt run rfc.command-lifecycle.validate --json

      - name: App author checks - nicaragua-projekt
        run: pnpm exec werkstatt run apps-check.author --app nicaragua-projekt --json

      - name: Tests
        run: pnpm test

      - name: Test signal validation
        run: pnpm exec werkstatt run test.signal.validate --json

      - name: Test signal policy validation
        run: pnpm exec werkstatt run test.signal.policy.validate --json

      - name: Maintenance debt baseline validation
        run: pnpm exec werkstatt run maintenance.debt.baseline.validate --json

      - name: Platform consistency validate
        run: pnpm exec werkstatt run platform.consistency.validate --check --json

      - name: Platform commit discipline validate
        run: pnpm exec werkstatt run platform.commit.discipline.validate --base origin/main --json

  forge-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    name: Forge tests on Windows
    env:
      TZ: UTC
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build forge
        run: pnpm --filter @warpgogol/forge run build

      - name: Forge tests
        run: pnpm --filter @warpgogol/forge run test
