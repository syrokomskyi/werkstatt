name: Generated-file hand-edit guard (RFC-0336)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  generated-edit-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: generated.edit.guard
    env:
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: generated.edit.guard
        run: pnpm exec werkstatt run generated.edit.guard --range origin/main..HEAD --json
