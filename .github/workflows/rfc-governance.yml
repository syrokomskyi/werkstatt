name: RFC governance

on:
  pull_request:
    paths:
      - "docs/rfcs/**"
      - "AGENTS.md"
      - ".github/workflows/rfc-governance.yml"
      - "packages/os/site-kernel*/**"
  workflow_dispatch:

jobs:
  rfc-validate:
    runs-on: ubuntu-latest
    name: RFC validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate RFC corpus
        run: pnpm exec site-kernel run rfc.validate
