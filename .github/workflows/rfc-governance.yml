name: RFC governance

on:
  pull_request:
    paths:
      - "docs/rfcs/**"
      - "AGENTS.md"
      - ".github/workflows/rfc-governance.yml"
      - "packages/werkstatt/**"
      - "packages/werkstatt-site/**"
      - "packages/forge/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rfc-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: RFC validate
    env:
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate RFC corpus
        run: pnpm exec werkstatt run rfc.validate
