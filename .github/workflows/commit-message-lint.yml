name: Commit message lint (RFC-0265)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  commit-message-lint:
    runs-on: ubuntu-latest
    name: commit.message.lint

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: commit.message.lint
        run: pnpm exec site-kernel run commit.message.lint --json
