schemaVersion: 1.0.0
services:
  - id: matomo-proxy
    kind: proxy-worker
    workerName: matomo-proxy
    hostedBy: studio
    url: https://matomo-proxy.syrokomskyi.workers.dev
    publicEndpoints: true
    routes:
      - /_wg/analytics/*
    upstreams:
      - matomo-cloud
    subdomains: []
    lastDeployed:
      at: null
      state: null
      operationId: null
    healthCheckPath: /_wg/analytics/health
    lastDevDeployed:
      at: null
      state: null
      operationId: null
