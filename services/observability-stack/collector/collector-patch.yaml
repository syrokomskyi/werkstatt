# RFC-0337/RFC-0338: collector patch — gateway enrichment + PII redaction.
# Merged into the SigNoz-shipped otel-collector config (runbook step).
processors:
  # RFC-0337: enrich Cloudflare-originated traces that lack warpgogol.* attributes.
  transform/warpgogol-enrich:
    trace_statements:
      - context: resource
        statements:
          - set(attributes["warpgogol.site_id"], attributes["service.name"]) where attributes["warpgogol.site_id"] == nil
          - set(attributes["warpgogol.layer"], "site") where attributes["warpgogol.layer"] == nil
  # RFC-0337: strip query strings / PII-bearing span attributes before storage.
  transform/warpgogol-redact:
    trace_statements:
      - context: span
        statements:
          - replace_pattern(attributes["url.full"], "\\?.*$", "")
          - replace_pattern(attributes["http.url"], "\\?.*$", "")
          - delete_key(attributes, "http.request.header.cookie")
          - delete_key(attributes, "http.request.header.authorization")
