# extract.config.yaml — repo-extract standalone package export for @warpgogol/werkstatt-knowledge
# Extracts packages/werkstatt-knowledge from the werkstatt monorepo into a standalone private repo.
# RFC-0773: Engine publication pipeline via repo-extract to private npm.

projectDir: packages/werkstatt-knowledge
destName: werkstatt-knowledge
standalone: true

workspacePrefixes:
  - "@warpgogol/"
stripScopes:
  - "@warpgogol/"
preservePackages:
  - "@warpgogol/werkstatt-knowledge"
  - "@warpgogol/werkstatt"
  - "@warpgogol/forge"
packageManager: "pnpm"

ci:
  provider: github-actions
  publish: true
  nodeVersion: 24

ignoreDirs:
  - .turbo
  - .agents
  - node_modules
  - tmp-*

excludePathSegments:
  - .npmrc
  - src/tests
  - pnpm-lock.yaml

postProcess:
  - action: delete
    path: AGENTS.md
  - action: delete
    path: pnpm-lock.yaml

git:
  remote: git@github.com:syrokomskyi/werkstatt-knowledge.git
  autoPush: true
