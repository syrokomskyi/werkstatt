id: send-message-section
uniName: send-message-section
layer: section
semanticId: send-message
archetype: send-message
cosmicName: Ceres
role: lead-message-capture
version: 1.1.0
intent:
  - drive-contact
  - capture-lead
  - convert-visitor
industryFit: []
contentSchemaKey: send-message-section
contentTypesPath: ./send-message-section.types.generated.ts

# RFC-0149: this section requires a server endpoint. api.routes.generate emits a thin
# GENERATED re-export at src/pages/api/send-message.ts (Astro APIRoute, prerender = false)
# on sites that use it, and projects `secrets` into the app's astro:env schema.
api:
  - route: send-message
    handler: "@warpgogol/ui/sections/send-message/api"
    methods:
      - POST
    # RFC-0181: the form only PUBLISHES to QStash EU; channel/CRM fan-out happens in
    # the delivery callback (/api/integration-route). Only the QStash publish secrets here.
    secrets:
      - UPSTASH_QSTASH_URL
      - UPSTASH_QSTASH_TOKEN
  # RFC-0181: the shared QStash delivery callback. Declared here too (identical to the
  # chat-widget entry; api.routes.generate dedupes by route) so a form-only site — with
  # no chat widget — still emits /api/integration-route for QStash to call back.
  - route: integration-route
    handler: "@warpgogol/ui/sections/chat-widget/delivery-api"
    methods:
      - POST
    secrets:
      - UPSTASH_QSTASH_CURRENT_SIGNING_KEY
      - UPSTASH_QSTASH_NEXT_SIGNING_KEY
      - UPSTASH_REDIS_REST_URL
      - UPSTASH_REDIS_REST_TOKEN
      - INTEGRATION_TELEGRAM_BOT_TOKEN
      - INTEGRATION_TELEGRAM_CHAT_ID
      - INTEGRATION_WHATSAPP_TOKEN
      - INTEGRATION_WHATSAPP_PHONE_ID
      - INTEGRATION_WHATSAPP_TO
      - INTEGRATION_PIPEDRIVE_API_TOKEN
      - INTEGRATION_PIPEDRIVE_DOMAIN
      - INTEGRATION_EMAIL_TO
      - INTEGRATION_EMAIL_FROM
      # Lagebild MVP: CRM buffer. Self-enabling — adapter skips if secrets absent.
      - SUPABASE_BUFFER_URL
      - SUPABASE_BUFFER_SERVICE_KEY
      - SUPABASE_BUFFER_TENANT_ID

propsSchemaCompose:
  - section-visual
  - section-header

propsSchema:
  type: object
  additionalProperties: false
  required:
    - header
    - placeholder
    - buttonLabel
    - successMessage
    - errorMessage
    - emailField
  properties:
    header:
      type: object
    body:
      type: object
      additionalProperties: false
      required:
        - paragraphs
      properties:
        paragraphs:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        align:
          type: string
          enum:
            - left
            - center
            - right
    formId:
      type: string
      minLength: 1
    endpoint:
      type: string
      minLength: 1
    placeholder:
      type: string
      minLength: 1
    buttonLabel:
      type: string
      minLength: 1
    sendingLabel:
      type: string
      minLength: 1
    successMessage:
      type: string
      minLength: 1
    errorMessage:
      type: string
      minLength: 1
    emptyMessage:
      type: string
      minLength: 1
    minMessageLength:
      type: number
      minimum: 1
    fallbackEmail:
      type: string
      minLength: 1
    fallbackEmailLabel:
      type: string
      minLength: 1
    fallbackBodyLabel:
      type: string
      minLength: 1
    copyMessageLabel:
      type: string
      minLength: 1
    emailField:
      type: object
      additionalProperties: false
      required:
        - enabled
        - required
      properties:
        enabled:
          type: boolean
        required:
          type: boolean
        label:
          type: string
          minLength: 1
        placeholder:
          type: string
          minLength: 1
    phoneField:
      type: object
      additionalProperties: false
      required:
        - enabled
        - required
      properties:
        enabled:
          type: boolean
        required:
          type: boolean
        label:
          type: string
          minLength: 1
        placeholder:
          type: string
          minLength: 1
    referrerField:
      type: object
      additionalProperties: false
      required:
        - enabled
        - required
      properties:
        enabled:
          type: boolean
        required:
          type: boolean
        label:
          type: string
          minLength: 1
        placeholder:
          type: string
          minLength: 1
