id: final-cta-section
uniName: final-cta-section
layer: section
semanticId: final-cta
archetype: final-cta
cosmicName: Dione
role: final-cta
version: 1.5.0
intent:
  - convert-visitor
  - drive-contact
  - capture-lead
industryFit: []
contentSchemaKey: final-cta-section
contentTypesPath: ./final-cta-section.types.generated.ts

propsSchemaCompose:
  - section-visual
  - section-header
  - body-paragraphs

propsSchema:
  type: object
  additionalProperties: false
  required:
    - header
    - ctaGroup
  properties:
    ctaGroup:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        align:
          type: string
          enum:
            - left
            - center
            - right
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - label
              - target
            properties:
              label:
                type: string
                minLength: 1
              ariaLabel:
                type: string
              variant:
                type: string
                enum:
                  - primary
                  - secondary
                  - ghost
                  - danger
              size:
                type: string
                enum:
                  - sm
                  - md
                  - lg
              fullWidth:
                type: boolean
              target:
                type: object
                additionalProperties: false
                required:
                  - kind
                properties:
                  kind:
                    type: string
                    enum:
                      - internal
                      - external
                      - anchor
                  pageId:
                    type: string
                  anchor:
                    type: string
                  href:
                    type: string
                  rel:
                    type: string
