id: hero-decision-card-section
uniName: hero-decision-card-section
layer: section
semanticId: hero-decision-card
archetype: hero-decision-card
cosmicName: Phobos
role: hero
version: 1.1.0
numbered: false
intent:
  - introduction
  - cta
  - clarify-positioning
industryFit:
  - trades-and-construction
  - consulting-and-coaching
  - legal-services
contentSchemaKey: hero-decision-card-section
contentTypesPath: ./hero-decision-card-section.types.ts

propsSchemaCompose:
  - section-visual
  - section-header

propsSchema:
  type: object
  additionalProperties: false
  required:
    - header
  properties:
    hideSectionNumber:
      type: boolean
    tagline:
      type: string
    backgroundImage:
      type: string
    leadImage:
      type: object
      additionalProperties: false
      required:
        - src
        - alt
      properties:
        src:
          type: string
          minLength: 1
        alt:
          type: string
          minLength: 1
    leadImageVisible:
      type: boolean
    primaryCta:
      type: object
      additionalProperties: false
      required:
        - label
        - target
      properties:
        label:
          type: string
          minLength: 1
        target:
          type: string
          minLength: 1
    secondaryCta:
      type: object
      additionalProperties: false
      required:
        - label
        - target
      properties:
        label:
          type: string
          minLength: 1
        target:
          type: string
          minLength: 1
    decisionCard:
      type: object
      additionalProperties: false
      properties:
        effects:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - target
              - stack
            properties:
              target:
                type: string
                minLength: 1
              stack:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - kind
                    - enabled
                  properties:
                    kind:
                      const: glass
                    enabled:
                      type: boolean
                    blur:
                      type: number
                    saturate:
                      type: number
                    tint:
                      type: string
                    tintOpacity:
                      type: number
                    border:
                      type: string
                      enum:
                        - hairline
                        - none
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - label
              - value
            properties:
              label:
                type: string
                minLength: 1
              value:
                type: string
                minLength: 1
