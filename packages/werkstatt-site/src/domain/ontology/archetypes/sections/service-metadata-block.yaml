id: service-metadata-block
displayName: Service metadata block
version: 1.0.0
semanticRole: page-metadata-footer
description: |
  Page-level metadata footer. RFC-0103 bodyKind: composite; default tone muted.
expectedIntents:
  - build-trust
  - legal-clarity
expectedIndustryFit:
  - trades-and-construction
  - consulting-and-coaching
  - legal-services
  - non-profit
layoutHint: single-column
bodyKind: composite
propsSchema:
  $shape: zod
  compose:
    - section-visual
    - section-header
  shape: |
    z.object({
      version: z.string().optional(),
      effectiveDate: z.string().optional(),
      nextReviewDate: z.string().optional(),
      versionLabel: z.string().optional(),
      effectiveDateLabel: z.string().optional(),
      nextReviewDateLabel: z.string().optional(),
      linksLabel: z.string().optional(),
      links: z.array(z.object({
        label: z.string().min(1),
        href: z.string().min(1),
        rel: z.string().optional(),
      })).optional(),
      footnote: z.string().optional(),
    }).strict()
acceptedCosmicNames:
  - Sedna
constraints: {}
