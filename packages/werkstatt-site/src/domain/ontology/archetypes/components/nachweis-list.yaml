id: nachweis-list
displayName: Nachweis List
version: 1.0.0
semanticRole: trust-list
description: |
  List of nachweis-card components for the Nachweis index page.
  Renders published records only. Shows an empty state message when no
  published records exist. RFC-0708.
expectedIntents:
  - verify
expectedIndustryFit:
  - non-profit
layoutHint: single-column
propsSchema:
  $shape: zod
  shape: |
    z.object({
      records: z.array(z.object({
        slug: z.string(),
        title: z.string(),
        result: z.string(),
        scope: z.string().optional(),
        context: z.string().optional(),
        limitations: z.string().optional(),
        quote: z.string().optional(),
        quoteLang: z.string().optional(),
        source: z.string().optional(),
        verifiedScope: z.string().optional(),
        notVerifiedScope: z.string().optional(),
        status: z.enum(["draft", "preview", "published", "withdrawn"]),
        verifiedByLabel: z.string().optional(),
      })).default([]),
      emptyMessage: z.string().optional(),
    }).passthrough()
acceptedCosmicNames:
  - Hydra
constraints: {}
