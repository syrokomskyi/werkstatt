id: hero-section
uniName: hero-section
layer: section
semanticId: hero
archetype: hero
cosmicName: Europa
role: hero
version: 1.5.0
numbered: false
intent:
  - convert-visitor
  - establish-identity
  - clarify-positioning
industryFit: []
contentSchemaKey: hero-section
contentTypesPath: ./hero-section.types.generated.ts

propsSchemaCompose:
  - section-visual
  - section-header

propsSchema:
  type: object
  additionalProperties: false
  required:
    - header
  properties:
    hideSectionNumber:
      type: boolean
    tagline:
      type: string
    subheading:
      type: string
    description:
      type: string
    imageAlt:
      type: string
      minLength: 1
    backgroundImage:
      type: string
    portraitImage:
      type: string
    leadImage:
      type: object
      additionalProperties: false
      required:
        - src
        - alt
      properties:
        src:
          type: string
          minLength: 1
        alt:
          type: string
          minLength: 1
    leadImageFade:
      type: object
      additionalProperties: false
      properties:
        top:
          type: boolean
        bottom:
          type: boolean
        left:
          type: boolean
        right:
          type: boolean
        width:
          type: number
          minimum: 0
          maximum: 0.5
    leadImagePlacement:
      type: string
      enum:
        - portrait
        - after-heading
    ctaPrimaryLabel:
      type: string
    ctaPrimaryAriaLabel:
      type: string
    ctaSecondaryLabel:
      type: string
    ctaSecondaryAriaLabel:
      type: string
    ctaSecondaryUrl:
      type: string
    ctaPrimaryUrl:
      type: string
    primaryCtaTarget:
      type: string
    secondaryCtaTarget:
      type: string
    animated:
      type: boolean
    creditDisplay:
      type: string
      enum:
        - shown
        - hidden
    containerVariant:
      type: string
      enum:
        - default
        - narrow
        - full
    stats:
      type: array
      minItems: 0
      items:
        type: object
        additionalProperties: false
        required:
          - label
        properties:
          value:
            type: string
          label:
            type: string
          numericValue:
            type: number
          prefix:
            type: string
          suffix:
            type: string
          decimals:
            type: number
          duration:
            type: number
