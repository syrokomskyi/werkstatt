id: chat-widget-section
uniName: chat-widget-section
layer: section
semanticId: chat-widget
archetype: chat-widget
cosmicName: Amalthea
role: consent-gated-chat-launcher
version: 1.0.0
intent:
  - drive-contact
  - capture-lead
  - convert-visitor
industryFit: []
contentSchemaKey: chat-widget-section
contentTypesPath: ./chat-widget-section.types.generated.ts

# RFC-0176/0181: the chat widget is a source. UChat POSTs captured leads to the
# inbound route, which publishes to Upstash QStash (EU); QStash calls back the
# integration-route, which runs the client's destinations with the client's tokens.
# api.routes.generate emits both src/pages/api/*.ts (prerender = false) and projects
# these secrets into the app's astro:env schema.
# Architecture review: API route handlers moved to @warpgogol/werkstatt-site/ui/integration-routes —
# delivery endpoints are integration infrastructure, not UI section logic.
api:
  - route: integration-inbound
    handler: "@warpgogol/werkstatt-site/ui/integration-routes/inbound"
    methods:
      - POST
    secrets:
      - INTEGRATION_INBOUND_SECRET
      - UPSTASH_QSTASH_URL
      - UPSTASH_QSTASH_TOKEN
  # RFC-0191: Stripe is a billing source. Stripe POSTs signed webhooks here; the handler
  # verifies the signature over the raw body, maps to an IntegrationEvent (source "stripe"),
  # and publishes to QStash (EU) for delivery to integration-route, which routes billing
  # events to the Lagebild buffer only (no channel fan-out). No Make.com.
  - route: stripe-webhook
    handler: "@warpgogol/werkstatt-site/ui/integration-routes/stripe-webhook"
    methods:
      - POST
    secrets:
      - STRIPE_WEBHOOK_SECRET
      - UPSTASH_QSTASH_URL
      - UPSTASH_QSTASH_TOKEN
  - route: integration-route
    handler: "@warpgogol/werkstatt-site/ui/integration-routes/delivery"
    methods:
      - POST
    # RFC-0181: the single delivery fan-out — verifies QStash, dedups via Redis, then
    # runs channels + CRM (client tokens) and emails via Cloudflare Email Routing.
    secrets:
      - UPSTASH_QSTASH_CURRENT_SIGNING_KEY
      - UPSTASH_QSTASH_NEXT_SIGNING_KEY
      - UPSTASH_REDIS_REST_URL
      - UPSTASH_REDIS_REST_TOKEN
      - INTEGRATION_TELEGRAM_BOT_TOKEN
      - INTEGRATION_TELEGRAM_CHAT_ID
      - INTEGRATION_WHATSAPP_TOKEN
      - INTEGRATION_WHATSAPP_PHONE_ID
      - INTEGRATION_WHATSAPP_TO
      - INTEGRATION_PIPEDRIVE_API_TOKEN
      - INTEGRATION_PIPEDRIVE_DOMAIN
      - INTEGRATION_EMAIL_TO
      - INTEGRATION_EMAIL_FROM
      # Lagebild MVP: CRM buffer. Self-enabling — adapter skips if secrets absent.
      - SUPABASE_BUFFER_URL
      - SUPABASE_BUFFER_SERVICE_KEY
      - SUPABASE_BUFFER_TENANT_ID

propsSchemaCompose:
  - section-visual
  - section-header

