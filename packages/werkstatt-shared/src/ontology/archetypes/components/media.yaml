id: media
displayName: Media
version: 1.0.0
semanticRole: component-media
description: |
  RFC-0210 unified media primitive: one component renders every <video> on the platform,
  profile-driven — feature (content video with controls, HLS-first ABR + MP4 fallback + captions),
  background (muted looping decorative loop), and ambient (living photo, RFC-0202, delegated to
  <LivePhoto>). Derived delivery formats come from the GENERATED video manifest.
expectedIntents:
  - orient-visitor
  - demonstrate-expertise
expectedIndustryFit: []
layoutHint: split
propsSchema:
  $shape: zod
  shape: |
    z.object({}).passthrough()
acceptedCosmicNames:
  - Sycorax
constraints: {}
