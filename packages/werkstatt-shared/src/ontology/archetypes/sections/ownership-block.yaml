id: ownership-block
displayName: Ownership block
version: 1.2.0
semanticRole: client-ownership-disclosure
description: |
  Explicit list of what belongs to the client (domain, data, agreed materials).
  RFC-0103 bodyKind: list.
expectedIntents:
  - trust
  - legal-clarity
  - de-risk
expectedIndustryFit:
  - trades-and-construction
  - consulting-and-coaching
  - legal-services
layoutHint: split
bodyKind: list
recommendedItemCount:
  min: 3
  max: 8
propsSchema:
  $shape: zod
  compose:
    - section-visual
    - section-header
    - body-list
  shape: |
    z.object({
      offeringRef: z.string().optional(),
      body: z.object({
        kind: z.literal("list"),
        items: z.array(z.object({
          text: z.string().min(1),
          chargeRef: z.string().optional(),
          icon: z.object({
            vendor: z.string(),
            collection: z.string(),
            name: z.string(),
            size: z.number().optional(),
          }).optional(),
        })).min(1),
        note: z.string().optional(),
        iconColor: z.enum(["primary", "accent", "success", "warning", "error", "muted"]).optional(),
        align: z.enum(["left", "center", "right"]).optional(),
        itemAlign: z.enum(["left", "center", "right"]).optional(),
        hideMarkers: z.boolean().optional(),
      }),
    }).passthrough()
acceptedCosmicNames:
  - Helene
constraints:
  forbidPhrases:
    - wir behalten
    - Eigentum übergeht an
  mandatoryConcepts:
    - Domain
    - Daten
