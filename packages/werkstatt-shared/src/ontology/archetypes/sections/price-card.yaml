id: price-card
displayName: Price card
version: 1.1.0
semanticRole: pricing-disclosure
description: |
  Open price disclosure block. RFC-0101/0102 composed; RFC-0100 list-item shape
  for "includes". Forbidden to frame as discount ("only X €/day") or to
  compare to small purchases ("less than a coffee").
expectedIntents:
  - pricing
  - trust
  - clarify-positioning
expectedIndustryFit:
  - trades-and-construction
  - consulting-and-coaching
  - legal-services
layoutHint: decision-card
bodyKind: composite
recommendedItemCount:
  min: 1
  max: 1
propsSchema:
  $shape: zod
  compose:
    - section-visual
    - section-header
  shape: |
    z.object({
      monthly: z.string().optional(),
      yearly: z.string().optional(),
      setup: z.string().optional(),
      includes: z.array(z.object({
        text: z.string().min(1),
        icon: z.object({
          vendor: z.string(),
          collection: z.string(),
          name: z.string(),
          size: z.number().optional(),
        }).optional(),
      })).optional(),
    }).strict()
acceptedCosmicNames:
  - Pan
constraints:
  forbidPhrases:
    - günstig
    - von 1 €/Tag
    - weniger als ein Kaffee
    - Schnäppchen
  enforceTabularNumerals: true
