  max: 10
propsSchema:
  $shape: zod
  compose:
    - section-visual
    - section-header
    - body-split-list
acceptedCosmicNames:
  - Calypso
constraints:
  forbidPhrases:
    - ROI garantiert
    - garantierte Leads
    - "100% Erfolg"
    - Platz 1 auf Google
    - Verkäufe garantiert
