routePatterns:
  - pattern: "/:locale?/:slug"
    params:
      locale:
        optional: true
        enum: [de, en]
      slug:
        type: string
    generated: false
  - pattern: "/:locale?/:industry/:city"
    params:
      locale:
        optional: true
        enum: [de, en]
      industry:
        type: string
        from: ontology.Industry
      city:
        type: string
    generated: true
  - pattern: "/:locale?/:industry/:city/:demand"
    params:
      locale:
        optional: true
        enum: [de, en]
      industry:
        type: string
        from: ontology.Industry
      city:
        type: string
      demand:
        type: string
    generated: true
  - pattern: "/:locale?/:industry/:service"
    params:
      locale:
        optional: true
        enum: [de, en]
      industry:
        type: string
        from: ontology.Industry
      service:
        type: string
    generated: true
  - pattern: "/:locale?/ratgeber/redaktion"
    params:
      locale:
        optional: true
        enum: [de, en]
    generated: false
  - pattern: "/:locale?/team"
    params:
      locale:
        optional: true
        enum: [de, en]
    generated: false
  - pattern: "/:locale?/komanda"
    params:
      locale:
        optional: true
        enum: [uk]
    generated: false
  - pattern: "/:locale?/team/ki-agenten/:agentSlug"
    params:
      locale:
        optional: true
        enum: [de, en]
      agentSlug:
        type: string
    generated: true
  - pattern: "/:locale?/komanda/ki-agenty/:agentSlug"
    params:
      locale:
        optional: true
        enum: [uk]
      agentSlug:
        type: string
    generated: true
  # RFC-0512: Team JSON endpoints (machine-readable profiles)
  - pattern: "/team/profiles.json"
    params: {}
    generated: true
  - pattern: "/team/:slug/profile.json"
    params:
      slug:
        type: string
    generated: true
  - pattern: "/team/ki-agenten/:agentSlug/profile.json"
    params:
      agentSlug:
        type: string
    generated: true
localePrefix:
  strategy: optional-prefix
  default: de
