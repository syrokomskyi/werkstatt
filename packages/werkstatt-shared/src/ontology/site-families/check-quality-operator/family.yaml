id: check-quality-operator
displayName: Check · Quality-operator
version: 1.0.0
description: |
  Trust system for URL-first website-quality operators. The visitor arrives
  with a URL, understands what the check covers, and runs or requests a
  concrete quality audit with an actionable report. No Handwerk conversion
  funnel, no donation ask — the primary action is "run the check".

detection:
  signals:
    archetypePrimary: quality-audit-tool
    audienceAny: [webmasters, operators, agencies]
    conversionPrimary: check-initiated
    materialMentionsAny: [url-check, quality-report, action-pack, audit]
  threshold: 0.7

recipe:
  candidateBiomes:
    - check-concrete-blueprint
  candidateConstellations:
    - check-quality-landing
  requiredSectionArchetypes:
    - hero
  conversionGoals:
    primary:
      id: check-initiated
      eventName: check-started
    secondary:
      - id: report-downloaded
        eventName: report-downloaded
      - id: faq-engagement
        eventName: faq-question-opened
  auditThresholds:
    urlFirstFraming: required
    actionPackVisible: required
    testimonialPresent: forbidden
  agentReadinessBaseline:
    maxBytesToCta: 4096
    requireStructuredData: [Organization, FAQPage]
