id: shell.site-background
displayName: Site Background
version: 1.0.0
semanticRole: component-shell.site-background
description: |
  RFC-0105 full-viewport background shell-layer component. Declared at most
  once per page as a shell block. Independent of the section-level
  SectionBackground (RFC-0101).
expectedIntents:
  - paint-site-background
expectedIndustryFit:
  - non-profit
layoutHint: single-column
bodyKind: composite
propsSchema:
  $shape: zod
  shape: |
    z.object({
      layers: z.array(z.unknown()).min(1),
      lang: z.string().optional(),
    }).strict()
acceptedCosmicNames:
  - Hermippe
constraints:
  maxPerPage: 1
