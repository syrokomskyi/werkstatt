id: nachweis-card
displayName: Nachweis Card
version: 1.0.0
semanticRole: trust-card
description: |
  Semantic article displaying a Nachweis record: result/scope, context/limitations,
  quote, source, what was verified, what was not verified, and status.
  RFC-0708.
expectedIntents:
  - verify
expectedIndustryFit:
  - non-profit
layoutHint: card-grid
propsSchema:
  $shape: zod
  shape: |
    z.object({
      slug: z.string(),
      title: z.string(),
      result: z.string(),
      scope: z.string().optional(),
      context: z.string().optional(),
      limitations: z.string().optional(),
      quote: z.string().optional(),
      quoteLang: z.string().optional(),
      source: z.string().optional(),
      verifiedScope: z.string().optional(),
      notVerifiedScope: z.string().optional(),
      status: z.enum(["draft", "preview", "published", "withdrawn"]),
      verifiedByLabel: z.string().optional(),
    }).passthrough()
acceptedCosmicNames:
  - Praxidike
constraints: {}
