id: hero-decision-card
displayName: Hero · Decision card
version: 1.1.0
semanticRole: hero-with-decision-card
description: |
  Hero with side decision card. RFC-0101/0102 composed; decision card uses
  RFC-0101 GlassConfig.
expectedIntents:
  - introduction
  - cta
  - clarify-positioning
expectedIndustryFit:
  - trades-and-construction
  - consulting-and-coaching
  - legal-services
layoutHint: decision-card
bodyKind: composite
recommendedItemCount:
  min: 3
  max: 4
propsSchema:
  $shape: zod
  compose:
    - section-visual
    - section-header
  shape: |
    z.object({
      tagline: z.string().optional(),
      ctaNote: z.string().min(1).optional(),
      backgroundImage: z.string().optional(),
      primaryCta: z.object({
        label: z.string().min(2),
        target: z.string().min(1),
      }).optional(),
      secondaryCta: z.object({
        label: z.string().min(2),
        target: z.string().min(1),
      }).optional(),
      decisionCard: z.object({
        glass: z.object({
          enabled: z.boolean(),
          blur: z.number().optional(),
          saturate: z.number().optional(),
          tint: z.string().optional(),
          tintOpacity: z.number().optional(),
          border: z.enum(["hairline", "none"]).optional(),
        }).optional(),
        items: z.array(z.object({
          label: z.string().min(2),
          value: z.string().min(2),
        })).min(1),
      }).optional(),
    }).strict()
acceptedCosmicNames:
  - Phobos
constraints:
  forbidPhrases:
    - günstig
    - Ergebnis garantiert
    - "100% Erfolg"
