id: handwerk-owner-de
locale: de
label: Inhaber eines deutschen Handwerksbetriebs
audience: Kleine und mittlere Handwerksbetriebe in Deutschland, die eine vertrauenswürdige lokal auffindbare Website brauchen.
goals:
  - Schnell verstehen, welches konkrete Angebot die Website macht.
  - Vertrauen in Anbieter, Prozess und Ergebnis gewinnen.
  - Ohne Umwege Kontakt aufnehmen oder ein Erstgespräch anfragen.
anxieties:
  - Unklare Preise, leere Versprechen oder zu abstrakte Digitalberatung.
  - Zu viel Technikjargon und zu wenig Bezug zum eigenen Betrieb.
  - Zweifel, ob die Website später gepflegt und lokal gefunden wird.
vocabulary:
  - Handwerksbetrieb
  - lokal gefunden werden
  - Erstgespräch
  - Website
