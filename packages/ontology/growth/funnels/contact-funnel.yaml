# Funnel: contact-funnel
# DNA-28 / RFC-0027
#
# Tracks the contact form engagement funnel.

id: contact-funnel
label: Contact Form Funnel
description: >
  Tracks visitors from initial contact form interaction to successful submission.

steps:
