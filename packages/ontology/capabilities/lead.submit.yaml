# RFC-0288: closed capability catalog record. Never authored per-app — this
# file lives in the workspace ontology and applies to every site that holds
# the agent.actions entitlement and renders the send-message section.
id: lead.submit
version: 1
kind: action
title:
  de: Anfrage senden
  en: Submit an inquiry
description:
  de: Übermittelt eine Kontaktanfrage an das Unternehmen.
  en: Delivers a contact inquiry to the business.
input:
  type: object
  required: [message]
  additionalProperties: false
  properties:
    message:
      type: string
      minLength: 10
      maxLength: 4000
    name:
      type: string
      maxLength: 200
    email:
      type: string
      format: email
    phone:
      type: string
      maxLength: 40
    eventId:
      type: string
      format: uuid
output:
  type: object
  additionalProperties: false
  properties:
    accepted:
      type: boolean
    eventId:
      type: string
integration:
  eventKind: lead
  source: agent
requires:
  entitlements: []
  sections: [send-message]
humanEquivalent:
  sectionType: send-message
limits:
  perMinutePerIp: 10
  maxPayloadBytes: 16384
