# RFC-0288: closed capability catalog record. Dormant until a site holds both
# agent.actions AND booking (RFC-0240) — demonstrates additional per-capability
# entitlement gating beyond the tier-wide agent.actions gate.
id: appointment.request
version: 1
kind: action
title:
  de: Termin anfragen
  en: Request an appointment
description:
  de: Übermittelt eine Terminanfrage an das Unternehmen.
  en: Delivers an appointment request to the business.
input:
  type: object
  required: [message]
  additionalProperties: false
  properties:
    message:
      type: string
      minLength: 10
      maxLength: 4000
    name:
      type: string
      maxLength: 200
    email:
      type: string
      format: email
    phone:
      type: string
      maxLength: 40
    preferredDate:
      type: string
      format: date
    eventId:
      type: string
      format: uuid
output:
  type: object
  additionalProperties: false
  properties:
    accepted:
      type: boolean
    eventId:
      type: string
integration:
  eventKind: appointment
  source: agent
requires:
  entitlements: [booking]
  sections: [booking]
humanEquivalent:
  sectionType: booking
limits:
  perMinutePerIp: 6
  maxPayloadBytes: 16384
