# extract.config.yaml — repo-extract standalone package export for @warpgogol/werkstatt-phaser-game
# Extracts packages/werkstatt-phaser-game from the werkstatt monorepo into a standalone private repo.
# RFC-0773: Engine publication pipeline via repo-extract to private npm.

projectDir: packages/werkstatt-phaser-game
destName: werkstatt-phaser-game
standalone: true

workspacePrefixes:
  - "@warpgogol/"
stripScopes:
  - "@warpgogol/"
preservePackages:
  - "@warpgogol/werkstatt-phaser-game"
  - "@warpgogol/werkstatt"
packageManager: "pnpm"

ci:
  provider: github-actions
  publish: true
  nodeVersion: 24

ignoreDirs:
  - .turbo
  - .agents
  - node_modules
  - tmp-*

excludePathSegments:
  - .npmrc
  - src/tests

postProcess:
  - action: delete
    path: AGENTS.md

git:
  remote: git@github.com:syrokomskyi/werkstatt-phaser-game.git
  autoPush: true
