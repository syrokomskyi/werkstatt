# extract.config.yaml — repo-extract standalone package export for @warpgogol/werkstatt-game
# Extracts packages/werkstatt-game from the werkstatt monorepo into a standalone private repo.
# RFC-0773: Engine publication pipeline via repo-extract to private npm.
# RFC-0777: Game plugin publication config.

projectDir: packages/werkstatt-game
destName: werkstatt-game
standalone: true

workspacePrefixes:
  - "@warpgogol/"
stripScopes:
  - "@warpgogol/"
preservePackages:
  - "@warpgogol/werkstatt-game"
  - "@warpgogol/werkstatt"
packageManager: "pnpm"

ignoreDirs:
  - .turbo
  - .agents
  - node_modules
  - tmp-*

excludePathSegments:
  - .npmrc

postProcess:
  - action: delete
    path: AGENTS.md

git:
  remote: git@github.com:syrokomskyi/werkstatt-game.git
  autoPush: true
