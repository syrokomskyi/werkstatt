# extract.config.yaml — repo-extract standalone package export for @warpgogol/werkstatt
# Extracts packages/werkstatt from the werkstatt monorepo into a standalone private repo.
# RFC-0773: Engine publication pipeline via repo-extract to private npm.

projectDir: packages/werkstatt
destName: werkstatt
standalone: true

workspacePrefixes:
  - "@warpgogol/"
stripScopes:
  - "@warpgogol/"
preservePackages:
  - "@warpgogol/werkstatt"
  - "@warpgogol/werkstatt-shared"
  - "@warpgogol/forge"
stubPackages:
  - "@warpgogol/werkstatt-site"
packageManager: "pnpm"

ci:
  provider: github-actions
  publish: true
  nodeVersion: 24

ignoreDirs:
  - .turbo
  - .agents
  - node_modules
  - tmp-*

excludePathSegments:
  - .npmrc
  - src/tests
  - pnpm-lock.yaml

postProcess:
  - action: delete
    path: AGENTS.md
  - action: delete
    path: pnpm-lock.yaml

git:
  remote: git@github.com:syrokomskyi/werkstatt.git
  autoPush: true
