waves:
  - id: 1
    name: Foundation
    goal: Establish immutable identity, deterministic decisions, profile policy, and durable evidence storage.
  - id: 2
    name: Orchestration and site quality
    goal: Run complete deterministic and independent qualitative certification for real site candidates.
  - id: 3
    name: Deployment and ongoing truth
    goal: Make certification authoritative for channel transitions and current Main health.
  - id: 4
    name: Clean migration and estate reduction
    goal: Republish the sole site through the new system, then remove only proven-obsolete heavy legacy material.
