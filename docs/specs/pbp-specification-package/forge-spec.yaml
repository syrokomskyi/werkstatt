decisions:
  - id: ADR-001
    title: System name is Public Business Profile (PBP)
    status: accepted
    rationale: Covers business, catalog, offerings, trust, and public projections;
      UOM was too Offering-focused.
  - id: ADR-002
    title: PBP is a logical model, not a single physical format
    status: accepted
    rationale: One file per entity does not scale to hundreds of thousands of
      variants; Markdown/Git, datasets, databases, and adapters are all valid.
  - id: ADR-003
    title: Federated product identity
    status: accepted
    rationale: Product has a global URI and authority but no mandatory central
      registry; avoids governance and identity-dispute problems.
  - id: ADR-004
    title: Global layer standardizes semantics
    status: accepted
    rationale: A business-independent registry holds Category, ComparisonProfile,
      units, metrics, identifier schemes, derivations, and schemas.
  - id: ADR-005
    title: Local catalog is a separate layer
    status: accepted
    rationale: Product answers 'what is it', CatalogEntry 'how does this business
      list it', Offering 'how does this business sell it'.
  - id: ADR-006
    title: Offering references CatalogEntry
    status: accepted
    rationale: Local SKU, merchandising, and local description do not belong on the
      global Product.
  - id: ADR-007
    title: Category and ComparisonProfile are separated
    status: accepted
    rationale: Category answers 'what is it', ComparisonProfile 'by which dimensions
      is it compared'.
  - id: ADR-008
    title: Variant is separate from Bundle
    status: accepted
    rationale: ProductGroup + ProductVariant model variation axes; Bundle models
      composition of independent products.
  - id: ADR-009
    title: Module is not an entity
    status: accepted
    rationale: "'Module' remains a presentation term; in the model it is a
      Product/CatalogEntry/Offering with a relation."
  - id: ADR-010
    title: Pricing block is named pricing
    status: accepted
    rationale: In pbp/offering@1 the name is 'pricing', not 'commercial'; fixes
      namespace drift.
  - id: ADR-011
    title: Charge, Plan, Adjustment are separated
    status: accepted
    rationale: Price is not a string or single object; Charge is accrual, Plan is a
      set of charges and conditions, Adjustment is a discount/correction.
  - id: ADR-012
    title: Money is stored as decimal string
    status: accepted
    rationale: '"70.00" not float or presentation string; exact arithmetic and
      stable serialization.'
  - id: ADR-013
    title: Buyer quantity is not stored in catalog
    status: accepted
    rationale: Selected quantity appears in Quote/Order runtime; Offering stores
      units, allowances, limits, tiers, minimum rules.
  - id: ADR-014
    title: Tax semantics reserved in @1
    status: accepted
    rationale: Schema supports buyerTypes, tax treatment, jurisdiction; buyerType is
      in audience, not inside price.
  - id: ADR-015
    title: Policy is a separate entity
    status: accepted
    rationale: Reusable SLA, guarantees, rights, cancellation, and retention rules
      are typed Policies.
  - id: ADR-016
    title: Guarantee requires remedy
    status: accepted
    rationale: A promise without a remedy is not called a guarantee.
  - id: ADR-017
    title: SLA requires a measurement contract
    status: accepted
    rationale: Metric, threshold, window, method, evidence, exclusions, and remedy
      are mandatory.
  - id: ADR-018
    title: Claim sidecars are removed
    status: accepted
    rationale: All *.claims.yaml keyed by source path are eliminated; replaced by
      governance in entity, Claim entity, EvidenceSource, no path-based
      identity.
  - id: ADR-019
    title: Disclosure is a separate typed entity
    status: accepted
    rationale: Material dependencies/limitations are Disclosure; not a miscellaneous
      container.
  - id: ADR-020
    title: Review is not a Claim
    status: accepted
    rationale: Review and AggregateRating have their own schemas; author, source,
      permissions, freshness differ from business-authored Claim.
  - id: ADR-021
    title: Credential is designed now
    status: accepted
    rationale: Certification/license/qualification/membership/insurance get a
      separate entity boundary; implementation may follow Webgogol core.
  - id: ADR-022
    title: Derivation Contract generalizes TCO
    status: accepted
    rationale: All computed facts go through a versioned deterministic Derivation
      Contract; no ad hoc formulas or stored calculated strings.
  - id: ADR-023
    title: One Buyer View Schema
    status: accepted
    rationale: "12 sections: Identity, Suitability, Value, Package, Options,
      Pricing, Buyer Responsibilities, Fulfillment, Assurances, Rights,
      Lifecycle, Limitations."
  - id: ADR-024
    title: Missing does not mean false
    status: accepted
    rationale: Absent = not-declared; explicit false, null, and not-applicable are
      distinguished.
  - id: ADR-025
    title: Locale IDs are identical
    status: accepted
    rationale: ID contains no .de, /de/, or other locale marker.
  - id: ADR-026
    title: Default locale stores invariant facts
    status: accepted
    rationale: Non-default locale contains only allowed localized overrides; price
      and conditions must not diverge between languages.
  - id: ADR-027
    title: Complex collections are keyed maps
    status: accepted
    rationale: For localization and references, complex collections are addressed by
      semantic key, not array index.
  - id: ADR-028
    title: Projection is not the source of truth
    status: accepted
    rationale: Website, JSON-LD, CRM, contract, invoice views are generated;
      manually maintained duplicate business facts in templates are forbidden.
  - id: ADR-029
    title: Runtime state is separated
    status: accepted
    rationale: Inventory/availability/booking capacity overlays static graph through
      source contracts; Webgogol capacity block is not carried over.
  - id: ADR-030
    title: History is stored in Git
    status: accepted
    rationale: Curated manifest history = Git; build adds sourceRevision; Bordbuch
      is an optional derived publication event.
  - id: ADR-031
    title: Schema version and data revision are distinct
    status: accepted
    rationale: pbp/offering@1 describes format; Git revision describes data state.
  - id: ADR-032
    title: Canonical snapshot, not Markdown, is signed
    status: accepted
    rationale: Resolved JSON → canonicalization → digest → detached signature; RFC
      8785 JCS baseline.
  - id: ADR-033
    title: Sichtpass is implemented later
    status: accepted
    rationale: Schema boundaries and canonicalization ready now; signing and VC
      mapping later.
  - id: ADR-034
    title: Format is temporarily proprietary
    status: accepted
    rationale: During deployment PBP remains proprietary; open trigger at 300
      clients or earlier technical maturity; stable URIs, docs, schemas,
      conformance tests from day one.
  - id: ADR-035
    title: llms.txt does not become a core entity
    status: accepted
    rationale: PBP defines MachineUsePolicy; current conventions are projections.
  - id: ADR-036
    title: Public/private profiles are physically separated
    status: accepted
    rationale: Bank, tax number, secrets, and customer data are outside public PBP.
  - id: ADR-037
    title: HTML is forbidden in canonical facts
    status: accepted
    rationale: <br> and other presentation markup are not allowed in canonical data
      fields.
  - id: ADR-038
    title: No empty-string semantics
    status: accepted
    rationale: Empty string does not mean missing; field omitted or explicit
      semantic status used.
  - id: ADR-039
    title: Controlled vocabularies are required
    status: accepted
    rationale: Unit, metric, relation, identifier scheme, and value vocabularies are
      versioned; no uncontrolled strings like hour/hours/Std/h.
  - id: ADR-040
    title: Relation core is minimal
    status: accepted
    rationale: optional, requires, incompatibleWith, alternativeTo, included;
      recommendedWith→Recommendation/Claim, replaces→lifecycle successor,
      availableAfter→requires+condition.
  - id: ADR-041
    title: External standards are mappings, not canonical core
    status: accepted
    rationale: PBP maps to Schema.org, GS1, JSON-LD, VC; not limited to their
      least-common-denominator fields.
  - id: ADR-042
    title: Webgogol is first fixture, not universal proof
    status: accepted
    rationale: Before RFC freeze, test a minimal physical good and a variant
      commerce case.
  - id: ADR-043
    title: Legacy removed after migration
    status: accepted
    rationale: No compatibility layer; old files deleted after 100% coverage and
      clean build.
  - id: ADR-044
    title: hourlyRate is unresolved
    status: accepted
    rationale: Do not attach business-global hourly rate automatically; possible
      outcomes are separate Offering, overage Charge, or private internal rate.
  - id: ADR-045
    title: 99% uptime and 7 hours cannot coexist as exact equivalents
    status: accepted
    rationale: Owner chooses normative model; recommended 99% per calendar month
      with calculated allowed downtime.
  - id: ADR-046
    title: Capacity waves are not static Offering facts
    status: accepted
    rationale: Remove current capacity block from PBP.
  - id: ADR-047
    title: Document metadata stays with document descriptor
    status: accepted
    rationale: No central meta.md for AGB/privacy/imprint dates.
  - id: ADR-048
    title: External services require materiality review
    status: accepted
    rationale: Not every internal tool becomes a public Disclosure.
  - id: ADR-049
    title: Compliance dates do not prove compliance
    status: accepted
    rationale: GoBD dates alone do not create a compliance Claim.
  - id: ADR-050
    title: Comparison does not imply ranking
    status: accepted
    rationale: ComparisonProfile exposes dimensions; ranking needs a separate
      transparent methodology/derivation.
