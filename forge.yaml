schema: forge/config@1
project:
  name: warpgogol
  stack:
    - typescript
    - astro
    - turborepo
  packageManager: pnpm
paths:
  rfcsDir: docs/rfcs
  adrsDir: docs/adrs
  plansDir: docs/plans
  auditsDir: docs/audits
  specsDir: docs/specs
  skillsDir: .agents/skills
  sessionsDir: docs/sessions
bindings:
  schema: forge/bindings@1
  commands:
    validateRfc: pnpm exec werkstatt run rfc.validate --id {id} --json
    validateAdr: pnpm exec werkstatt run adr.validate --id {id} --json
    implementStamp: pnpm exec werkstatt run rfc.implement.stamp --id {id}
      --implementation-commit {commit}
    adrImplementStamp: pnpm exec werkstatt run adr.implement.stamp --id {id}
      --implementation-commit {commit}
    typecheck: pnpm --filter {workspace} run build:check
    test: pnpm --filter {workspace} run test
    scopedBuild: pnpm --filter {workspace} run build
    validate: pnpm --filter {workspace} run build:check
    produce: pnpm --filter {workspace} run build
    verify: pnpm --filter {workspace} run test
    specValidate: pnpm exec werkstatt run spec.validate --spec={id} --json
    sessionSave: pnpm exec werkstatt run session.save --json
    manifestGenerate: pnpm exec werkstatt run command.manifest.generate
  paths:
    invariantsFile: docs/architecture-dna.md
    compassDocs:
      - docs/requirements.xml
      - docs/technology.xml
      - docs/development-plan.xml
      - docs/knowledge-graph.xml
      - docs/verification-plan.xml
      - docs/source-markup.xml
      - docs/styling.xml
    reviewsDir: docs/reviews
    handoffsDir: docs/handoffs
    sessionsDir: docs/sessions
  terminology:
    invariants: DNA
    compass: Compass XML
  compass:
    fileExtensions:
      - .ts
      - .tsx
      - .astro
      - .js
      - .mjs
      - .css
    testPatterns:
      - "*.test.ts"
      - "*.spec.ts"
      - "**/tests/**"
      - "**/test/**"
skillPacks:
  - prefix: wg
    dir: packages/warpgogol-skills/skills
forge:
  syncedVersion: 0.23.0
independentVersionPackages:
  - packages/forge
